    category: identifier
  - pattern: no_ktp
    category: identifier
  - pattern: npwp
    category: identifier
  - pattern: no_bpjs
    category: identifier
  - pattern: bpjs
    category: identifier
  - pattern: nama
    category: name
  - pattern: nama_lengkap
    category: name
  - pattern: alamat
    category: address
  - pattern: tanggal_lahir
    category: date
  - pattern: no_hp
    category: contact
  - pattern: no_telepon
    category: contact
