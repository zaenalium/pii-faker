<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Faker - Sign in</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #1f2933;
        }
        form {
            width: 100%;
            max-width: 380px;
            margin: 16px;
            padding: 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        h1 { margin: 0 0 8px; font-size: 1.4rem; }
        p { margin: 0 0 20px; color: #52606d; font-size: 0.9rem; line-height: 1.4; }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd2d9;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            border: 0;
            border-radius: 8px;
            background: #3b5bdb;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        .error { margin-bottom: 16px; color: #c92a2a; font-size: 0.9rem; }
    </style>
</head>
<body>
    <form method="post" action="/login">
        <h1>PII Faker</h1>
        <p>Enter the access token printed when the server started
           (or set in <code>PII_FAKER_TOKEN</code>).</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        <input type="password" name="token" placeholder="Access token" autocomplete="current-password" autofocus required>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
