[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-faker"
version = "0.1.0"
description = "PII Fake/Redact Toolkit - Detect, fake, or redact PII in tabular and JSON datasets for LLM-safe data sharing"
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICENSE*"]
requires-python = ">=3.10"
authors = [
    {name = "PII Faker Contributors"}
]
keywords = ["pii", "privacy", "llm", "data-protection", "fake-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "polars>=1.0.0",
    "fastexcel>=0.9.0",
    "xlsxwriter>=3.1.0",
    "faker>=22.0.0",
    "typer>=0.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
pii-faker = "pii_faker.cli.main:app"

[project.urls]
Homepage = "https://github.com/zaenalium/pii-faker"
Documentation = "https://github.com/zaenalium/pii-faker#readme"
Repository = "https://github.com/zaenalium/pii-faker"
Issues = "https://github.com/zaenalium/pii-faker/issues"

[tool.hatch.build.targets.wheel]
packages = ["pii_faker"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".commandcode",
  ".pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["pii_faker/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
